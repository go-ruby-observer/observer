name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  COVERAGE_FLOOR: "100.0"

jobs:
  # 3-OS native: Linux, macOS, Windows. Coverage gate enforced on each OS.
  native:
    name: native (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            arch: amd64
          - os: linux
            runner: ubuntu-24.04-arm
            arch: arm64
          - os: macos
            runner: macos-latest
            arch: arm64
          - os: windows
            runner: windows-latest
            arch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (with coverage gate)
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -covermode=atomic -coverprofile=cover.out ./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}% (floor ${COVERAGE_FLOOR}%)"
          awk -v c="$total" -v m="$COVERAGE_FLOOR" 'BEGIN { exit (c+0 >= m+0) ? 0 : 1 }' \
            || { echo "Coverage ${total}% below floor ${COVERAGE_FLOOR}%"; exit 1; }

  # Windows build gate for the other 64-bit arch (ensures GOOS=windows builds
  # everywhere, independent of the windows-latest runner being amd64).
  windows-cross:
    name: windows cross-build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: windows
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

  # 6 64-bit arches under QEMU (amd64/arm64 already covered natively above).
  emulated:
    name: emulated (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu_cpu: "rv64,v=true,vlen=128"
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu_cpu: "la464"
          - arch: ppc64le
            image: debian:trixie
            qemu_cpu: "power9"
          - arch: s390x
            image: debian:trixie
            qemu_cpu: "qemu"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Set up binfmt (QEMU)
        run: docker run --rm --privileged tonistiigi/binfmt --install all
      - name: Cross-compile per-package test binaries
        run: |
          set -euo pipefail
          mkdir -p testbins
          for pkg in $(go list ./...); do
            name=$(echo "$pkg" | tr '/' '_')
            echo "Compiling test binary for $pkg"
            CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
              go test -c -covermode=atomic -o "testbins/${name}.test" "$pkg" || {
                echo "no test binary for $pkg (no tests?)"
              }
          done
          ls -l testbins
      - name: Run test binaries under QEMU (${{ matrix.arch }})
        run: |
          set -euo pipefail
          shopt -s nullglob
          for bin in testbins/*.test; do
            echo "::group::Running $bin on linux/${{ matrix.arch }}"
            docker run --rm --platform linux/${{ matrix.arch }} \
              -e QEMU_CPU='${{ matrix.qemu_cpu }}' \
              -v "$PWD":/work -w /work \
              ${{ matrix.image }} \
              "/work/$bin" -test.v -test.short
            echo "::endgroup::"
          done

  wasm:
    name: wasm (${{ matrix.goos }}/wasm)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [js, wasip1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build ${{ matrix.goos }}/wasm
        run: GOOS=${{ matrix.goos }} GOARCH=wasm go build ./...
